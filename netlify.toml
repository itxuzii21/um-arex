[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/admin/content"
  to = "/.netlify/functions/admin-content"
  status = 200

[[redirects]]
  from = "/api/admin/passcode"
  to = "/.netlify/functions/admin-passcode"
  status = 200
